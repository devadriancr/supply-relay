{% extends "base.html" %}

{% block title %}{{ t("login_title") }} · Supply Relay{% endblock %}

{% block body %}
{% include "_flashes.html" %}

<main class="login">
    <div class="login-corner">
        {% include "_language.html" %}
        {% include "_theme_toggle.html" %}
    </div>
    <div class="login-card">
        <div class="login-brand">
            <span class="brand-mark brand-mark-lg" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h11l-3-3M20 17H9l3 3"/></svg>
            </span>
            <h1>{{ t("login_title") }}</h1>
            <p class="muted">Supply Relay · {{ t("login_subtitle") }}</p>
        </div>

        <form method="post" action="/login" class="stack">
            <input type="hidden" name="csrf" value="{{ csrf }}">
            <div class="field">
                <label for="username">{{ t("username") }} <span class="required">*</span></label>
                <input id="username" name="username" type="text" autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label for="password">{{ t("password") }} <span class="required">*</span></label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="button button-primary button-block" data-tooltip="{{ t('sign_in_tip') }}">
                {{ t("sign_in") }}
            </button>
        </form>
    </div>
</main>
{% endblock %}
